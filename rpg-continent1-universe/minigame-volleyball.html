<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>氣球排球（第一大陸 × 遊戲宇宙版轉接）</title>
<script>
// v0.4.0：氣球排球轉接頁（不修改 minigames/volleyball/ 任何檔案）
//   ・讀取原本的 ../minigames/volleyball/index.html，原樣寫進這一頁（網址參數 ?embed=adventure&session=…&opponent=… 保持不變）
//   ・<base> 指回原本的資料夾 → 原本的 main.js、style.css、角色與音效全部照舊載入
//   ・唯一的差別：遠景背景圖 assets/court/volleyball_arena_bg.png 改用冒險端提供的大陸窗景（同樣 1672×941）
(function () {
  var BASE = '../minigames/volleyball/';
  var bg = '';
  try { bg = String(window.parent && window.parent !== window && window.parent.c1uWindowUrl ? window.parent.c1uWindowUrl() : ''); } catch (e) { bg = ''; }
  try { var u = new URL(bg, location.href); if (u.origin !== location.origin || !/\/assets\/adventure\/ui\/home\/window_continent_\d+\.png$/.test(u.pathname)) bg = ''; else bg = u.href; } catch (e) { bg = ''; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', BASE + 'index.html', false);
  xhr.send();
  var html = xhr.status === 200 ? xhr.responseText : '<p style="color:#fff">氣球排球載入失敗</p>';
  var patch = bg ? '<script>(function(){var BG=' + JSON.stringify(bg) + ';var d=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,"src");'
    + 'Object.defineProperty(HTMLImageElement.prototype,"src",{configurable:true,enumerable:d.enumerable,get:d.get,set:function(v){if(/assets\\/court\\/volleyball_arena_bg\\.png/.test(String(v))){window.__c1uBgSwapped=BG;v=BG;}d.set.call(this,v);}});})();<\/script>' : '';
  html = html.replace(/<head>/i, '<head><base href="' + BASE + '">' + patch);
  document.write(html);
})();
</script>
</head>
<body></body>
</html>
