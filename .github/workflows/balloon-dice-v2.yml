name: Balloon Dice v2 playtest
on:
  push:
    branches: [dev/balloon-dice-v2-cross-continent]
  pull_request:
    branches: [integration/ch3-abcd-test-4]
    paths:
      - 'rpg-dual-continent-test/**'
      - 'playtest-balloon-dice-v2-test-1/**'
      - '.github/workflows/balloon-dice-v2.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify dice and attempt lifecycle
        run: |
          node --check rpg-dual-continent-test/main.js
          node --test rpg-dual-continent-test/tests/*dice*.test.cjs
      - name: Prepare Chromium
        run: npm install --prefix "$RUNNER_TEMP/dice" --no-save playwright@1.51.1
      - name: Isolated Chrome checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/dice/node_modules/playwright
          CH3_SCREENSHOTS: dice-v2-screenshots
        run: |
          mkdir -p "$CH3_SCREENSHOTS"
          node --test rpg-dual-continent-test/tests/balloon-dice-v2.browser.cjs rpg-dual-continent-test/tests/chapter3-normal-flow.browser.cjs rpg-dual-continent-test/tests/chapter3-pages-isolation.browser.cjs rpg-dual-continent-test/tests/chapter3-water.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balloon-dice-v2-chrome
          path: dice-v2-screenshots/
          if-no-files-found: ignore
